# test/expected-prompts/ is the spec; test/check_prompt.rb compares against it.
#
# Joiners are owned by the segment BEFORE the boundary, drawn in its own colour
# over the next segment's background. A segment that vanishes takes its arrow
# with it, so no arrow is stranded in the colour of a segment that is gone.

format = """\
$directory\
${custom.directory_terminator}\
${custom.branch_clean}\
"""
add_newline = false

[directory]
format = "[ $path ](bg:blue fg:black)"
truncation_length = 0
truncate_to_repo = false

# Not part of [directory]: inside a repository a branch segment follows it and
# draws its own cap, so an unconditional one here would double-draw.
[custom.directory_terminator]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[](fg:blue)"
shell = ["bash", "--noprofile", "--norc"]

[custom.branch_clean]
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "git branch --show-current"
format = "[](fg:blue bg:green)[  $output ](fg:black bg:green)[](fg:green)"
shell = ["bash", "--noprofile", "--norc"]

[character]
disabled = true
