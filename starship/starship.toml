format = """\
$status\
$jobs\
$sudo\
$conda\
$python\
$aws\
$directory\
$git_branch\
$git_status\
$git_state\
$character\
"""

[status]
disabled = false
format = "[](fg:black)[$symbol$status](bg:black fg:red)[](fg:black)"

[jobs]
format = "[](fg:black)[⚙](bg:black fg:cyan)[](fg:black)"

[sudo]
disabled = false
format = "[](fg:black)[⚡](bg:black fg:yellow)[](fg:black)"

[python]
format = "[](fg:blue)[($virtualenv)](bg:blue fg:black)[](fg:blue)"

[conda]
format = "[](fg:magenta)[🐍 $environment](bg:magenta fg:black)[](fg:magenta)"

[aws]
format = "[](fg:green)[AWS: $profile](bg:green fg:black)[](fg:green)"

[directory]
format = "[](fg:blue)[$path](bg:blue fg:black)[](fg:blue)"
truncation_length = 4

[git_branch]
format = "[](fg:green)[$branch](bg:green fg:black)[](fg:green)"

[git_status]
format = "[](fg:yellow)[$all_status$ahead_behind](bg:yellow fg:black)[](fg:yellow)"

[git_state]
format = "[](fg:yellow)[$state](bg:yellow fg:black)[](fg:yellow)"
