# test/expected-prompts/ is the spec; test/check_prompt.rb compares against it.
#
# Joiners are owned by the segment BEFORE the boundary, drawn in its own colour
# over the next segment's background. A segment that vanishes takes its arrow
# with it, so no arrow is stranded in the colour of a segment that is gone.

format = """\
([ ](bg:black)$status$jobs[\uE0B0](fg:black bg:blue))\
$directory\
${custom.directory_terminator}\
${custom.branch_clean}\
${custom.branch_dirty}\
"""
add_newline = false

[directory]
format = "[ $path ](bg:blue fg:black)"
truncation_length = 0
truncate_to_repo = false

# Not part of [directory]: inside a repository a branch segment follows it and
# draws its own cap, so an unconditional one here would double-draw.
[custom.directory_terminator]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[ ](fg:blue)"
shell = ["bash", "--noprofile", "--norc"]

# Exactly one of these fires: starship has no way to read the previous segment's
# colour, so a dirty tree recolours the whole run by swapping the module.
[custom.branch_clean]
when = "test -z \"$(git status --porcelain 2>/dev/null)\" && git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "git branch --show-current | grep . || git rev-parse --short HEAD"
format = "[](fg:blue bg:green)[  $output ](fg:black bg:green)[ ](fg:green)"
shell = ["bash", "--noprofile", "--norc"]

[custom.branch_dirty]
when = "test -n \"$(git status --porcelain 2>/dev/null)\" && git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "git branch --show-current | grep . || git rev-parse --short HEAD"
format = "[](fg:blue bg:yellow)[  $output ± ](fg:black bg:yellow)[ ](fg:yellow)"
shell = ["bash", "--noprofile", "--norc"]

# agnoster's prompt_status builds one symbols array and draws one segment, so the
# leading pad and the arrow live in the root format's conditional group: it renders
# once if either symbol module does, and vanishes with both.
[status]
disabled = false
symbol = "✘"
format = "[$symbol ](fg:red bg:black)"

# symbol_threshold defaults to 1, so this is empty with no jobs and the group
# collapses on it. number_threshold is out of reach to keep the count off-prompt.
[jobs]
symbol = "⚙"
number_threshold = 1000
format = "[$symbol ](fg:cyan bg:black)"

[character]
disabled = true
