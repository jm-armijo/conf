# Tunables for the statusline's session-colour assignments.
#
# Sourced by claude/lib/session-colors.sh, which is in turn sourced by
# claude/scripts/statusline.sh. Every value here has an inline default in that
# library, so a missing, unreadable, or half-written config never breaks the
# statusline -- it just falls back.
#
# This file is symlinked to ~/.claude/statusline.conf by setup.sh, so edits
# here are live immediately. No reinstall, no restart.
#
# Shell syntax, but treat it as data: it is sourced, so anything you write here
# executes. Assignments only.

# How many days an unused colour assignment survives.
#
# The clock starts when a colour is FIRST assigned to a directory+branch and is
# never reset -- there is no "last used" tracking. So this is really "forget an
# assignment this long after it was made", not "after I last looked at it".
#
# The practical consequence: a session you keep open longer than this loses its
# row and picks up a NEW colour the next time the statusline renders. Raise the
# value if that bites you.
#
# Cleanup runs only when a new colour is being assigned, never on the far more
# frequent read path.
#
# Set to 0 to disable cleanup entirely. Assignments then live until you delete
# the database by hand.
STATUSLINE_COLOR_RETENTION_DAYS=30

# Where the assignments live.
#
# Machine-local and deliberately outside this repo: a colour assignment is a
# property of THIS laptop's set of checkouts, not of any project. Delete this
# file to reset every assignment; colours are then handed out again from the
# top of the palette.
STATUSLINE_COLOR_DB="$HOME/.claude/statusline-colors.db"
