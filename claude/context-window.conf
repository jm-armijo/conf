# Constants describing Claude Code's own context-window behaviour.
#
# These are NOT statusline settings, which is why they are not in
# statusline.conf. They are facts about when the AGENT auto-compacts. The
# statusline reads them so it can draw its usage gauge against the right scale,
# but it neither owns nor influences compaction, and anything else that needs
# to reason about the threshold -- a hook, another script -- should read these
# same values from here rather than restating them.
#
# Every value has an inline default in claude/scripts/statusline.sh, so a
# missing, unreadable, or half-written config never breaks the statusline -- it
# just falls back.
#
# This file is symlinked to ~/.claude/context-window.conf by setup.sh, so edits
# here are live immediately. No reinstall, no restart.
#
# Shell syntax, but treat it as data: it is sourced, so anything you write here
# executes. Assignments only.

# The model's context window, in tokens.
#
# 200000 is the standard window. Raise it to 1000000 when running a model with
# extended context, which changes the scale the gauge is drawn against but NOT
# the reserve below -- the reserve is absolute, not proportional.
#
# This is a ceiling, not a request: setting it higher than the model actually
# has does not buy any context, it just makes the gauge under-report. If
# settings.json carries an autoCompactWindow, that caps the effective window and
# this should match it, since the statusline clamps a larger window down to this
# value.
#
# A non-numeric value falls back to 200000.
CTX_MAX=200000

# Tokens held back for output, i.e. how far below CTX_MAX auto-compaction fires.
#
# Compaction triggers when the INPUT token count reaches CTX_MAX - CTX_RESERVE
# -- 167000 on a 200000 window. That threshold, not the raw window, is what the
# statusline treats as 100% full: scaling against CTX_MAX made the bar read only
# ~84% at the instant compaction fired, showing a seventh of the bar as headroom
# that did not exist.
#
# 33000 is EMPIRICALLY DERIVED. Anthropic does not document this number.
# Measured across 93 compact_boundary records in ~/.claude/projects/*/*.jsonl,
# "200000 - preTokens" fell in a tight 32852..33273 band. It is an ABSOLUTE
# output budget rather than a fraction of the window: the changelog puts
# compaction on a 1M window "at about 967K", the same ~33000 held back at five
# times the size, which is why raising CTX_MAX must NOT scale this value.
#
# TO RE-MEASURE, if compaction starts firing somewhere else:
#
#   jq -r 'select(.type=="compact_boundary")
#          | .compactMetadata.preTokens' ~/.claude/projects/*/*.jsonl
#
# Each number is the input token count immediately before a compaction. Subtract
# from the window that session ran with; the spread should again be tight. If it
# is not, compaction has stopped being a fixed reserve and this model no longer
# fits.
#
# Setting this at or above CTX_MAX leaves no usable window; the gauge reads 0%
# rather than dividing by zero. A non-numeric value falls back to 33000.
CTX_RESERVE=33000
