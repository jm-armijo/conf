# Pre-commit gate. Rationale: see README "Committing".

pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    shfmt:
      glob: "*.sh"
      # -d fails on a diff instead of rewriting, so a commit is never silently reformatted.
      run: shfmt -d -i 2 -ci {staged_files}

    # Globs are deliberately wider than the files the suite reads, and the trailing
    # "**" is NOT interchangeable with "**/*" -- see README "Pre-commit scoping".
    tests:
      glob:
        - "setup.sh"
        - "claude/**"
        - "zsh/**"
        - "starship/**"
        - "test/**"
      run: bats test/

    # A truncated .bats file defines fewer tests and still exits 0 -- see README
    # "Why the test count has a floor". Raise the floor when tests are added.
    test-count:
      glob: "test/**"
      run: |
        n=$(bats test/ --count)
        if [ "$n" -lt 105 ]; then
          echo "bats sees only $n tests (expected >= 105) -- a .bats file probably stopped parsing partway through"
          exit 1
        fi
