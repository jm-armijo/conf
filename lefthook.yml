# Pre-commit gate for this repo.
#
# setup.sh is the only executable here and it runs against a real $HOME — link()
# moves existing dotfiles aside. A bug reaches the machine the moment it's run,
# and there's no CI to catch it, so the checks live on the commit itself.
#
# Nothing here is softened with `|| true`: a check that can't fail can't protect
# anything.

pre-commit:
  parallel: true
  commands:
    # Correctness: catches quoting, unset-variable and exit-status bugs that
    # only show up on the one machine you're setting up.
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # Consistency: 2-space indent with switch/select cases indented, matching
    # the existing style in setup.sh. -d fails on a diff instead of rewriting,
    # so the commit is never silently reformatted behind your back.
    shfmt:
      glob: "*.sh"
      run: shfmt -d -i 2 -ci {staged_files}

    # Behaviour: the bats suite pins link()'s contract (creates the symlink,
    # idempotent, backs up rather than destroys). Deliberately NOT glob-scoped —
    # the tests must run on every commit, including ones that only touch config
    # data, since a config move can break the paths setup.sh links.
    tests:
      run: bats test/
