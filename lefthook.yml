pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    shfmt:
      glob: "*.sh"
      # Without -d, shfmt prints the formatted file and exits 0: the gate passes silently.
      run: shfmt -d -i 2 -ci {staged_files}

    # "**" is NOT interchangeable with "**/*" -- see README "Pre-commit scoping".
    tests:
      glob:
        - "setup.sh"
        - "claude/**"
        - "zsh/**"
        - "starship/**"
        - "test/**"
      run: bats test/

    # A truncated .bats file defines fewer tests and still exits 0.
    test-count:
      glob: "test/**"
      run: |
        n=$(bats test/ --count)
        if [ "$n" -lt 128 ]; then
          echo "bats sees only $n tests (expected >= 128) -- a .bats file probably stopped parsing partway through"
          exit 1
        fi
